# The plugins compile against the released IDE with the same build number as the fork base.
restudio.platformVersion=2026.3
restudio.lsp4ijVersion=0.21.0
# The runFork task starts the local fork build with the plugins.
# Set restudio.forkIdePath to override ~/.restudio-dev/ide/IntelliJ IDEA OSS.app/Contents.
restudio.version=0.1.0-SNAPSHOT

kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=true
org.gradle.caching=true
